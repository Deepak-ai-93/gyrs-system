<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Job Detail | GYRS Job Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:"#00288E",accent:"#FD761A"}}}}</script>
<script src="/assets/js/data.js"></script>
</head><body class="bg-slate-50 font-[Inter] text-slate-900">
<header class="bg-white shadow-sm sticky top-0 z-50"><div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
<a href="/" class="font-extrabold text-primary text-lg font-[Plus_Jakarta_Sans]">GYRS <span class="text-accent">Jobs</span></a>
<nav class="flex items-center gap-4 text-sm font-semibold"><a href="/" class="hover:text-primary">Home</a><a href="/jobs/" class="hover:text-primary">All Jobs</a><a href="/skills/" class="hover:text-primary">Skills</a><a href="/dashboard/" class="hover:text-primary">Dashboard</a><a href="/admin/" class="hover:text-primary">Admin</a></nav>
</div></header>
<main class="max-w-6xl mx-auto px-4 py-8">
<a href="/jobs/" class="text-sm text-primary font-bold">← Back to all jobs</a>
<div id="wrap" class="mt-3"></div>
</main>
<script>
const id = new URLSearchParams(location.search).get('id');
const job = GYRS.getJobs().find(j => j.id === id) || GYRS.getJobs()[0];
const me = GYRS.currentUser();
const match = me ? GYRS.matchScore(me.skills||[], job) : null;
document.title = job.title_en + " | GYRS Job Portal";
wrap.innerHTML = `
<div class="bg-white rounded-2xl shadow p-6 md:p-8">
<div class="flex flex-wrap gap-2 text-xs"><span class="px-2.5 py-1 rounded-full bg-blue-50 text-primary font-bold">${job.dept}</span><span class="text-slate-400">Advt: ${job.advt_no}</span><span class="px-2.5 py-1 rounded-full bg-red-50 text-red-700 font-bold">Last date: ${job.last_date}</span>${match!==null?`<span class="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-800 font-bold">Your match: ${match}%</span>`:""}</div>
<h1 class="mt-2 font-extrabold text-2xl md:text-3xl font-[Plus_Jakarta_Sans]">${job.title_en}</h1>
<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-4 text-sm">
<div class="p-4 rounded-xl bg-slate-50"><div class="text-xs text-slate-500">Vacancies</div><div class="font-extrabold text-lg">${job.posts}</div></div>
<div class="p-4 rounded-xl bg-slate-50"><div class="text-xs text-slate-500">Qualification</div><div class="font-bold">${job.qualification}</div></div>
<div class="p-4 rounded-xl bg-slate-50"><div class="text-xs text-slate-500">Salary</div><div class="font-bold">${job.salary}</div></div>
<div class="p-4 rounded-xl bg-slate-50"><div class="text-xs text-slate-500">Location</div><div class="font-bold">${job.location}</div></div>
<div class="p-4 rounded-xl bg-slate-50"><div class="text-xs text-slate-500">Age limit</div><div class="font-bold">${job.age_min} – ${job.age_max} yrs</div></div>
<div class="p-4 rounded-xl bg-slate-50"><div class="text-xs text-slate-500">Fees (Gen / Reserved)</div><div class="font-bold">₹${job.fees_gen} / ₹${job.fees_res}</div></div>
<div class="p-4 rounded-xl bg-slate-50"><div class="text-xs text-slate-500">Start date</div><div class="font-bold">${job.start_date}</div></div>
<div class="p-4 rounded-xl bg-slate-50"><div class="text-xs text-slate-500">Exam date</div><div class="font-bold">${job.exam_date||"—"}</div></div>
</div>
<div class="mt-4 flex flex-wrap gap-3">
<a href="${job.apply_url}" target="_blank" rel="noopener" class="px-6 py-3 rounded-xl bg-emerald-700 text-white font-bold">Apply on Official Website ↗</a>
<button id="saveBtn" class="px-5 py-3 rounded-xl bg-slate-900 text-white text-sm font-bold">Save Job</button>
<button id="appliedBtn" class="px-5 py-3 rounded-xl bg-white border text-sm font-bold">Mark as Applied</button>
</div>
<p class="mt-2 text-xs text-slate-500">You apply only on the recruiting organisation's own official website (link above). GYRS never takes applications or fees.</p>
</div>
<div class="mt-4 flex gap-2 text-sm font-bold">
<button data-tab="notif" class="tabBtn px-4 py-2 rounded-xl bg-primary text-white">Notification</button>
<button data-tab="docs" class="tabBtn px-4 py-2 rounded-xl bg-white shadow">Documents</button>
<button data-tab="elig" class="tabBtn px-4 py-2 rounded-xl bg-white shadow">Eligibility Check</button>
</div>
<div id="tab-notif" class="tab mt-3 bg-white rounded-2xl shadow p-6">
<h2 class="font-extrabold font-[Plus_Jakarta_Sans]">Official Notification</h2>
<p class="mt-2 text-sm text-slate-600">${job.notification}</p>
<div class="mt-3 text-sm"><span class="font-bold">Advertisement No:</span> ${job.advt_no} &nbsp;•&nbsp; <span class="font-bold">Department:</span> ${job.dept}</div>
<a href="${job.pdf_url}" class="mt-3 inline-block px-4 py-2 rounded-xl bg-slate-900 text-white text-sm font-bold">Download Notification PDF</a>
</div>
<div id="tab-docs" class="tab hidden mt-3 bg-white rounded-2xl shadow p-6">
<h2 class="font-extrabold font-[Plus_Jakarta_Sans]">Documents Required</h2>
<ul class="mt-2 flex flex-col gap-2 text-sm">${(job.documents||[]).map(d=>`<li class="p-3 rounded-xl bg-slate-50 flex items-center gap-2"><span>📄</span><span>${d}</span></li>`).join("")}</ul>
</div>
<div id="tab-elig" class="tab hidden mt-3 bg-white rounded-2xl shadow p-6">
<h2 class="font-extrabold font-[Plus_Jakarta_Sans]">Check Your Eligibility</h2>
<div class="mt-2 grid md:grid-cols-3 gap-3 text-sm">
<div><label class="text-xs font-bold">Date of Birth</label><input id="e_dob" type="date" value="2001-05-14" class="mt-1 w-full p-2.5 rounded-xl bg-slate-100"/></div>
<div><label class="text-xs font-bold">Category</label><select id="e_cat" class="mt-1 w-full p-2.5 rounded-xl bg-slate-100"><option>GEN</option><option>SEBC</option><option>EWS</option><option>SC</option><option>ST</option></select></div>
<div><label class="text-xs font-bold">Qualification</label><select id="e_edu" class="mt-1 w-full p-2.5 rounded-xl bg-slate-100"><option>10th Pass</option><option>12th Pass</option><option>ITI</option><option>Any Graduate</option><option>GNM / Nursing</option></select></div>
</div>
<button id="e_go" class="mt-3 px-4 py-2.5 rounded-xl bg-primary text-white text-sm font-bold">Check Now</button>
<p id="e_out" class="mt-2 text-sm font-bold"></p>
</div>`;
document.querySelectorAll('.tabBtn').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabBtn').forEach(x => { x.classList.remove('bg-primary','text-white'); x.classList.add('bg-white'); });
  b.classList.add('bg-primary','text-white'); b.classList.remove('bg-white');
  document.querySelectorAll('.tab').forEach(t => t.classList.add('hidden'));
  document.getElementById('tab-'+b.dataset.tab).classList.remove('hidden');
});
document.getElementById('e_go').onclick = () => {
  const dob = new Date(document.getElementById('e_dob').value||"2001-05-14");
  const age = new Date().getFullYear() - dob.getFullYear();
  const cat = document.getElementById('e_cat').value;
  const max = cat==="GEN" ? job.age_max : job.age_max + 5;
  const ok = age >= job.age_min && age <= max;
  const out = document.getElementById('e_out');
  out.textContent = ok ? `✓ Eligible — age ${age} within ${job.age_min}–${max} (${cat}).` : `✗ Not eligible — age ${age} outside ${job.age_min}–${max} (${cat}).`;
  out.className = "mt-2 text-sm font-bold " + (ok ? "text-emerald-700" : "text-red-600");
};
document.getElementById('saveBtn').onclick = () => {
  if(!me){ location.href="/auth/"; return; }
  const users = GYRS.getUsers(); const i = users.findIndex(x=>x.email===me.email);
  if(!(users[i].saved||[]).includes(job.id)) users[i].saved.push(job.id);
  GYRS.saveUsers(users); alert("Saved to dashboard.");
};
document.getElementById('appliedBtn').onclick = () => {
  if(!me){ location.href="/auth/"; return; }
  const users = GYRS.getUsers(); const i = users.findIndex(x=>x.email===me.email);
  if(!(users[i].applied||[]).includes(job.id)) users[i].applied.push(job.id);
  GYRS.saveUsers(users); alert("Marked as applied.");
};
</script></body></html>
